<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    <h1>SIMPLE CALCULATOR</h1>

    <div id="main_container">

        <div id="input_box">
            <input type="text" placeholder="0">
        </div>


        <div id="lower_container">

            <div id="charecter">
            <div class="digits3">
                <div class="dig">9</div>
                <div class="dig">8</div>
                <div class="dig">7</div>
            </div>

            <div class="digits3">
                <div class="dig">6</div>
                <div class="dig">5</div>
                <div class="dig">4</div>
            </div>

            <div class="digits3">
                <div class="dig">3</div>
                <div class="dig">2</div>
                <div class="dig">1</div>
            </div>

            <div class="digits3">
                <div class="dig">0</div>
            </div>
        </div>


        <div id="symbol">
            <div class="syb">
                <div class="ops">AC</div>
                <div class="ops">DEL</div>
            </div>
            <div class="syb">
                 <div class="ops">+</div>
                <div class="ops">-</div>
            </div>
            <div class="syb">
                 <div class="ops">/</div>
                <div class="ops">*</div>
            </div>

            <div class="syb">
                <div class="ops">=</div>
            </div>
        </div>
        </div>


    </div>

    <script src="app.js"></script>
</body>
</html>
